name: ci

# On each platform: builds the Lua library, then builds the server and runs the script checks and
# tests with that library. Platforms don't wait on each other.
on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, rid: osx-arm64, generator: Unix Makefiles }
          # The Intel Mac runner (macos-13 has been retired).
          - { os: macos-15-intel, rid: osx-x64, generator: Unix Makefiles }
          # Built on an older Ubuntu so the library also runs on older Linux systems.
          - { os: ubuntu-22.04, rid: linux-x64, generator: Unix Makefiles }
          - { os: ubuntu-22.04-arm, rid: linux-arm64, generator: Unix Makefiles }
          - { os: windows-2022, rid: win-x64, generator: NMake Makefiles }
    steps:
      - uses: actions/checkout@v4

      # Makes the Visual Studio compiler available to the build.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S ThirdParty/XLuaNative -B ThirdParty/XLuaNative/build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DXLUA_RID=${{ matrix.rid }}

      - name: Build Lua library
        run: cmake --build ThirdParty/XLuaNative/build

      - name: Smoke test
        run: ctest --test-dir ThirdParty/XLuaNative/build --output-on-failure -V

      - name: Inspect
        shell: bash
        run: |
          ls -l ThirdParty/XLuaNative/runtimes/${{ matrix.rid }}/native
          case "${{ runner.os }}" in
            Linux) objdump -T ThirdParty/XLuaNative/runtimes/${{ matrix.rid }}/native/libxlua.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 ;;
            macOS) otool -l ThirdParty/XLuaNative/runtimes/${{ matrix.rid }}/native/libxlua.dylib | grep -A3 LC_BUILD_VERSION ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: xlua-${{ matrix.rid }}
          path: ThirdParty/XLuaNative/runtimes/${{ matrix.rid }}/native/
          if-no-files-found: error

      # The Visual Studio setup sets Platform=x64 for the rest of the job. Left set, the .NET build
      # and tests disagree on the output folder.
      - name: Clear Platform
        if: runner.os == 'Windows'
        shell: bash
        run: echo "Platform=" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build server
        run: dotnet build Meteor.sln -c Debug

      # These two checks give the same answer everywhere, so they run on one platform only.
      - name: Lua API manifest is current
        if: matrix.rid == 'linux-x64'
        run: dotnet run --project Tools/LuaApi --no-build -- manifest --check

      - name: Script lint
        if: matrix.rid == 'linux-x64'
        run: dotnet run --project Tools/LuaApi --no-build -- lint

      # Loads every script and checks values passed to and from C#, pausing and waking scripts,
      # the wait timer and the lock order.
      - name: Engine tests
        run: dotnet test "Tests/Map Server Tests" --no-build --filter "Category!=Benchmark" --logger "console;verbosity=normal"

      # Navmesh, collision and pathing on synthetic scenes; needs no game data or navgen build.
      - name: Navigation tests
        run: dotnet test "Tests/Navigation Tests" --no-build --logger "console;verbosity=normal"

      - name: Engine benchmarks
        run: dotnet test "Tests/Map Server Tests" --no-build --filter "Category=Benchmark" --logger "console;verbosity=detailed"
