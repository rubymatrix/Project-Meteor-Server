[General]
server_ip=127.0.0.1
showtimestamp = true
; Seed for every random roll. A fixed seed makes tests repeat exactly; 0 picks a random one at start.
;dice_seed=0
; Local JSON API on 127.0.0.1 for tests and debugging tools. Off when unset or 0.
;admin_port=1990

[Database]
worldid=1
host=127.0.0.1
port=3306
database=ffxiv_server
username=root
password=

[Navigation]
; Folder with navgen's .nav files and manifest.json. Zones without a mesh walk in straight lines.
enabled=true
path=./navmesh
; Collision export folder. Defaults to "collision" beside the navmesh folder.
;collision=../collision
; Shorten moves that would walk through walls or off ledges: on | log | off.
chord_validator=on
