[General]
server_ip=0.0.0.0
; ffxivboot asks ver01.ffxiv.com:54996 for its version check.
patch_port=54996
; ffxivlogin opens http://account.square-enix.com/account/content/ffxivlogin on port 80.
login_port=80
; Sign-up and control panel.
panel_port=8000

[Patch]
; The versions this server supports. An install at these is up to date, an older one needs
; patches, and a newer one is turned away. Both must appear in web_patches.json.
; game_version takes a game.ver string or a name from [Releases].
boot_version=2010.09.18.0000
game_version=1.23b
info_url=http://www.example.com

[Releases]
; Release names for game_version: name=game.ver string.
1.23b=2012.09.19.0001

[Login]
; How long a game session from the login page stays valid.
session_hours=24
; Address of the sign-up page as the player's own browser reaches it (the login window opens
; this link in the system browser, outside the game's name redirect).
signup_url=http://127.0.0.1:8000/signup

[Database]
host=127.0.0.1
port=3306
database=ffxiv_server
username=root
password=
