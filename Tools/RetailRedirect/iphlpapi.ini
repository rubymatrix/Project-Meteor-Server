; Copy iphlpapi.dll and this file next to ffxivboot.exe.
[Redirect]
; The Meteor server's address (IP or host name). Empty: no redirect.
server=127.0.0.1
; Names to send to the server. These are the ones the retail executables use.
hosts=ver01.ffxiv.com,account.square-enix.com,lobby01.ffxiv.com,track01.ffxiv.com
; 1 writes iphlpapi.log next to the DLL: which processes loaded it and each redirect.
log=0

[Boot]
; The patch-signing certificate (patch_cert.der from Tools/PatchTool keygen) that ffxivboot uses
; instead of its own, so an unmodified retail boot accepts the server's signed patches. A path
; relative to this file's folder, or a full path. Empty: boot keeps the Square Enix certificate.
cert=
